<table data-signalminer-signature="true" role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;border-collapse:collapse;font-family:Inter,Arial,Helvetica,sans-serif;color:#111827;">
  <tr>
    <td style="font-size:15px;line-height:21px;font-weight:700;color:#111827;">{{signatureClosing}}</td>
  </tr>
  <tr>
    <td style="padding:0 0 10px;font-size:14px;line-height:20px;color:#374151;">{{senderName}}</td>
  </tr>
  <tr>
    <td style="font-size:13px;line-height:19px;color:#4b5563;">{{senderTitle}}</td>
  </tr>
  <tr>
    <td style="padding-top:6px;font-size:13px;line-height:19px;">
      <a href="{{websiteUrl}}" style="color:#2563eb;text-decoration:none;font-weight:700;"><span style="color:#2563eb;text-decoration:none;">{{signatureWebsiteLabel}}</span></a>
    </td>
  </tr>
</table>
