name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore SignalMiner.sln -p:NuGetAuditMode=all "-warnaserror:NU1901,NU1902,NU1903,NU1904"
      - run: dotnet build SignalMiner.sln --configuration Release --no-restore
      - run: dotnet test SignalMiner.sln --configuration Release --no-build --no-restore

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/signalminer-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/signalminer-dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm audit
